# Rotina diária de testes (manutenção preventiva / shift-right)
#   - regressão completa sobre a main
#   - smoke test sintético nos ambientes publicados (staging e produção)
# Falha abre (ou comenta) uma issue de defeito com label "rotina".

name: Rotina diária de testes

on:
  schedule:
    - cron: '17 10 * * *' # 07:17 em Salvador (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressao:
    name: Regressão completa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - name: Resumo de métricas
        if: always()
        run: node scripts/resumo-metricas.js >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke · ${{ matrix.app }} · ${{ matrix.ambiente }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        app: [AURORA, ABRIGO]
        ambiente: [STAGING, PRODUCAO]
    env:
      DEPLOYMENT_ID: ${{ vars[format('DEPLOYMENT_ID_{0}_{1}', matrix.app, matrix.ambiente)] }}
    steps:
      - uses: actions/checkout@v7
      - name: Health check
        run: |
          if [[ -z "$DEPLOYMENT_ID" ]]; then
            echo "::notice::${{ matrix.app }}/${{ matrix.ambiente }} não configurado — ignorado."
            exit 0
          fi
          scripts/smoke.sh "https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec"

  registrar-falha:
    name: Abrir issue de defeito
    needs: [regressao, smoke]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v7
        with:
          script: |
            const abrir = require('./scripts/github/abrir-issue-falha.js');
            await abrir({ github, context, core, origem: 'rotina' });
