# Triagem automática de defeitos: calcula a prioridade pela Matriz GUT
# (Gravidade × Urgência × Tendência) e aplica labels de prioridade e de
# categoria do Diagrama de Ishikawa a partir do formulário de defeito.

name: Triagem de defeitos

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  gut:
    if: contains(github.event.issue.labels.*.name, 'defeito')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const triagem = require('./scripts/github/triagem-gut.js');
            await triagem({ github, context, core });
