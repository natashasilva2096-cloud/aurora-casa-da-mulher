<style>
  :root {
    --fundo: #fbf8f4;
    --superficie: #ffffff;
    --tinta: #241a33;
    --tinta-suave: #5f5670;
    --linha: #e6dfeb;
    --primaria: #5b3a8e;
    --primaria-escura: #44296d;
    --primaria-clara: #efe7f7;
    --perigo: #c4302b;
    --perigo-escuro: #9e211d;
    --sucesso: #2e7d5b;
    --aviso: #a86400;
    --raio: 14px;
    --sombra: 0 1px 2px rgba(36, 26, 51, 0.06), 0 4px 14px rgba(36, 26, 51, 0.06);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--fundo); color: var(--tinta); }
  body {
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 96px; }
  header.topo { display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-bottom: 16px; padding-right: 120px; min-height: 48px; }
  .marca { font-weight: 700; font-size: 20px; letter-spacing: 0.2px; color: var(--primaria); }
  .marca small { display: block; font-weight: 400; font-size: 13px; color: var(--tinta-suave); }
  h1 { font-size: 22px; margin: 4px 0 12px; line-height: 1.25; }
  h2 { font-size: 18px; margin: 20px 0 8px; }
  p { margin: 0 0 12px; }
  .suave { color: var(--tinta-suave); font-size: 14px; }
  .tela { display: none; }
  .tela.ativa { display: block; animation: entrar 0.18s ease-out; }
  @keyframes entrar { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .cartao { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 16px; box-shadow: var(--sombra); margin-bottom: 12px; }

  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%; font: inherit; color: inherit; padding: 12px 14px; border: 1px solid var(--linha);
    border-radius: 10px; background: #fff; min-height: 48px;
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid rgba(91, 58, 142, 0.35); outline-offset: 1px; border-color: var(--primaria); }
  .erro-campo { color: var(--perigo); font-size: 13px; margin-top: 4px; min-height: 0; }
  .campo-invalido { border-color: var(--perigo); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
  .check input { width: 22px; min-height: 22px; margin-top: 2px; flex: 0 0 auto; }

  button, .botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 600;
    border: 0; border-radius: 12px; padding: 12px 18px; min-height: 48px; cursor: pointer; text-decoration: none;
    background: var(--primaria); color: #fff; width: 100%;
  }
  button:hover { background: var(--primaria-escura); }
  button[disabled] { opacity: 0.6; cursor: wait; }
  .secundario { background: var(--primaria-clara); color: var(--primaria-escura); }
  .secundario:hover { background: #e3d6f2; }
  .fantasma { background: transparent; color: var(--primaria); width: auto; padding: 8px 10px; min-height: 40px; }
  .fantasma:hover { background: var(--primaria-clara); }
  .perigo { background: var(--perigo); }
  .perigo:hover { background: var(--perigo-escuro); }
  .linha-botoes { display: flex; gap: 8px; margin-top: 12px; }
  .linha-botoes > * { flex: 1; }

  .saida-rapida {
    position: fixed; top: 10px; right: 10px; z-index: 50; width: auto; min-height: 36px; padding: 6px 12px;
    font-size: 13px; background: var(--tinta); color: #fff; border-radius: 999px;
  }
  .saida-rapida:hover { background: #000; }

  .abas { display: flex; background: var(--primaria-clara); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  .abas button { background: transparent; color: var(--primaria-escura); min-height: 40px; }
  .abas button.ativa { background: #fff; box-shadow: var(--sombra); }

  /* Botão de pânico — RNF03: identificado e acessado com facilidade, sem acionamento acidental */
  .panico-area { display: flex; flex-direction: column; align-items: center; padding: 8px 0 4px; }
  .panico {
    position: relative; width: 216px; height: 216px; border-radius: 50%; border: 0; padding: 0;
    background: radial-gradient(circle at 35% 30%, #e0524c, var(--perigo) 60%, var(--perigo-escuro));
    color: #fff; font-size: 20px; font-weight: 800; letter-spacing: 0.3px; line-height: 1.2;
    box-shadow: 0 10px 28px rgba(196, 48, 43, 0.35), inset 0 -6px 18px rgba(0, 0, 0, 0.18);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .panico:hover { background: radial-gradient(circle at 35% 30%, #e0524c, var(--perigo) 60%, var(--perigo-escuro)); }
  .panico span { display: block; padding: 0 28px; }
  .panico small { display: block; font-size: 13px; font-weight: 500; opacity: 0.9; margin-top: 6px; }
  .panico svg { position: absolute; inset: -8px; transform: rotate(-90deg); pointer-events: none; overflow: visible; }
  .panico circle { fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 703; stroke-dashoffset: 703; transition: stroke-dashoffset 0.05s linear; opacity: 0; }
  .panico.segurando circle { opacity: 1; }
  .panico.segurando { transform: scale(0.97); }

  .atalhos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .atalho { background: #fff; color: var(--tinta); border: 1px solid var(--linha); flex-direction: column; align-items: flex-start; text-align: left; padding: 14px; min-height: 92px; box-shadow: var(--sombra); }
  .atalho:hover { background: var(--primaria-clara); }
  .atalho strong { font-size: 15px; }
  .atalho span { font-weight: 400; font-size: 13px; color: var(--tinta-suave); }

  .emergencia { display: flex; gap: 8px; margin-top: 14px; }
  .emergencia a { flex: 1; text-align: center; text-decoration: none; border: 1px solid var(--linha); background: #fff; color: var(--tinta); border-radius: 12px; padding: 10px 6px; font-size: 13px; }
  .emergencia a strong { display: block; font-size: 20px; color: var(--perigo); }

  .alerta-status { border-left: 6px solid var(--perigo); }
  .pulso { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--perigo); margin-right: 8px; animation: pulso 1.4s infinite; vertical-align: middle; }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(196, 48, 43, 0.6); } 70% { box-shadow: 0 0 0 12px rgba(196, 48, 43, 0); } 100% { box-shadow: 0 0 0 0 rgba(196, 48, 43, 0); } }
  .estado { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--linha); font-size: 15px; }
  .estado:last-child { border-bottom: 0; }
  .ok { color: var(--sucesso); font-weight: 600; }
  .falha { color: var(--perigo); font-weight: 600; }
  .atencao { color: var(--aviso); font-weight: 600; }

  .lista { list-style: none; margin: 0; padding: 0; }
  .item { background: #fff; border: 1px solid var(--linha); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .item h3 { font-size: 16px; margin: 0 0 4px; }
  .item .meta { font-size: 13px; color: var(--tinta-suave); }
  .item .acoes { display: flex; gap: 8px; margin-top: 10px; }
  .item .acoes > * { flex: 1; min-height: 40px; padding: 8px 10px; font-size: 14px; }
  .selo { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--primaria-clara); color: var(--primaria-escura); }
  .selo.SOLICITADO { background: #fff3dc; color: var(--aviso); }
  .selo.CONFIRMADO { background: #e2f3ea; color: var(--sucesso); }
  .selo.CANCELADO { background: #f1eef3; color: var(--tinta-suave); }
  .selo.REALIZADO { background: #e7eefb; color: #2c5aa0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .chip { width: auto; min-height: 34px; padding: 6px 12px; font-size: 13px; font-weight: 600; border-radius: 999px; background: #fff; color: var(--tinta-suave); border: 1px solid var(--linha); }
  .chip.ativa { background: var(--primaria); border-color: var(--primaria); color: #fff; }

  .passos { padding-left: 20px; margin: 8px 0 0; font-size: 14px; }
  .passos li { margin-bottom: 6px; }
  .aviso-caixa { background: #fff8e8; border: 1px solid #f3dfb0; color: #6b4a00; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin: 12px 0; }
  .info-caixa { background: var(--primaria-clara); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin: 12px 0; }

  .voltar { margin: -4px 0 8px -10px; }
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(calc(100% + 40px)); background: var(--tinta);
    color: #fff; padding: 12px 18px; border-radius: 12px; max-width: 92vw; font-size: 15px; z-index: 60;
    transition: transform 0.2s ease, visibility 0.2s; visibility: hidden;
  }
  .toast.visivel { transform: translateX(-50%) translateY(0); visibility: visible; }
  [tabindex="-1"]:focus { outline: none; }
  .carregando { text-align: center; padding: 24px; color: var(--tinta-suave); }
  .rodape { text-align: center; font-size: 12px; color: var(--tinta-suave); margin-top: 28px; }
  .ambiente-selo { font-size: 11px; background: #fff3dc; color: var(--aviso); padding: 2px 8px; border-radius: 999px; }
  .mapa { width: 100%; height: 280px; border: 0; border-radius: 12px; margin: 8px 0; background: var(--primaria-clara); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
